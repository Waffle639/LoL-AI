name: lol2024-ai

services:
  api:
    build:
      context: .
      target: production
      args:
        DAGSHUB_USER: ${DAGSHUB_USER}
        DAGSHUB_TOKEN: ${DAGSHUB_TOKEN}
    ports:
      - "${PORT:-5508}:8000"
    env_file:
      - .env
    volumes:
      # data/ and logs/ are excluded from the image and mounted at runtime
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
