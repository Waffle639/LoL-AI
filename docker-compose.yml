name: lol2024-ai

services:
  api:
    build:
      context: .
      target: production
    ports:
      # HOST_PORT (configurable via PORT in .env) → container always on 8000
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # data/ and logs/ are excluded from the image and mounted at runtime
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
